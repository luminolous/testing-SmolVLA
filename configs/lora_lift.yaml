# Phase 4 LoRA fine-tuning of SmolVLA on robosuite Lift.
#
# Phase 2 established that the base checkpoint and robosuite are structurally
# incompatible: SmolVLA emits 6 SO-100 joint targets in degrees, robosuite consumes
# a 7-value normalised delta pose. Fine-tuning is the remedy, not a refinement.

dataset:
  repo_id: local/lift_ph
  root: data/lerobot/local_lift_ph

  # Held out by episode, never by frame. Frames inside one episode are strongly
  # correlated, so a frame-level split leaks the validation set into training and
  # makes the validation loss meaningless.
  val_fraction: 0.1
  seed: 0

model:
  checkpoint: lerobot/smolvla_base

  # 4.2 asks for bfloat16 base weights. The checkpoint already ships them: 474
  # bfloat16 tensors for the backbone and 26 float32 ones for the flow-matching
  # projections, which modeling_smolvla.py:808 requires to be float32. 0.844 GiB
  # of weights. "checkpoint" leaves that mix alone; casting to a single dtype
  # either breaks action_out_proj (bfloat16) or doubles the footprint (float32).
  dtype: checkpoint

  # Actions consumed per inference at evaluation time. Training is unaffected.
  n_action_steps: 50

  # SmolVLA resizes every camera to this before SigLIP, regardless of what the
  # dataset stores. It is the dominant cost in a training step: two cameras at
  # 512x512 is roughly four times the vision tokens of 256x256.
  #
  # null keeps the checkpoint's own 512, which is what the pretrained vision
  # weights saw. Lowering it buys throughput at the cost of moving the input
  # further from the pretraining distribution -- reasonable for a feasibility run,
  # less so when chasing task success.
  resize_imgs_with_padding: null

lora:
  # 4.1 -- what gets adapted, and why.
  #
  # target_modules: null uses lerobot's own defaults for SmolVLA, which are the
  # q/v projections of the action expert plus state_proj, action_in_proj,
  # action_out_proj and action_time_mlp_in/out
  # (modeling_smolvla.py:_get_default_peft_targets).
  #
  # The vision encoder is FROZEN, and not by default -- by evidence. Phase 2's
  # saved frames show the cube correctly framed and correctly oriented in the
  # wrist camera at step 0, so the visual path works. The failure is entirely in
  # the action mapping. Adapting the encoder would cost memory to fix something
  # that is not broken. Revisit only if training loss plateaus high.
  #
  # The action projections are included as LoRA targets rather than trained in
  # full. They are dimension-agnostic -- they operate at max_action_dim=32 and the
  # slice to the real action dim happens afterwards -- so going from 6 to 7 output
  # dimensions needs no new parameters at all. Raise the rank first if the model
  # underfits; unfreezing them fully is the next step after that.
  target_modules: null

  # Start small. Rank is the first thing to raise on underfitting.
  r: 16
  alpha: 32
  dropout: 0.05

training:
  # 4.2 -- memory-conscious setup for 6 GB.
  #
  # batch_size is the first knob to reduce on OOM, gradient_checkpointing the
  # second. Effective batch = batch_size * grad_accum_steps.
  #
  # Measured over 30 steps at an effective batch of 8 (short runs measure worker
  # startup, not steady state):
  #
  #   workers=0, 2x4 : 2.48 s/step
  #   workers=2, 2x4 : 1.96
  #   workers=4, 2x4 : 2.78   -- too many for this CPU
  #   workers=2, 4x2 : 1.89   <- chosen
  #   workers=2, 8x1 : 2.10
  #
  # An earlier sweep found batch 2 optimal, but that was run with workers=0, where
  # PNG decoding on the main thread was the bottleneck. Once loading is overlapped
  # the GPU can feed on a larger micro-batch.
  batch_size: 4
  grad_accum_steps: 2
  gradient_checkpointing: false

  # Sized to a ~1 hour budget: 1800 x 1.89 s is about 57 minutes, which buys
  # ~14 400 samples (1.6 epochs) and 1800 optimizer updates.
  #
  # The original 3000 x (2x8) at workers=0 ran ~4 hours for 5.5 epochs. Restore it
  # if the goal shifts from "does this train on this laptop" to chasing task
  # success.
  steps: 1800
  lr: 1.0e-4
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0

  # Scaled down with the run. At the original 200 the learning rate would spend a
  # ninth of training still warming up.
  warmup_steps: 120

  log_every: 25
  eval_every: 200
  save_every: 400

  # Windows spawns worker processes rather than forking, so each re-imports torch.
  # That startup dominates short runs -- an 8-step benchmark made workers look 2x
  # slower -- but amortises over a real run, where 2 workers are 21% faster than 0.
  # 4 workers are slower again on this CPU.
  num_workers: 2

vram:
  budget_gb: 5.0
