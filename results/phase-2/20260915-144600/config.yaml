env:
  name: Lift
  robot: Panda
  controller: OSC_POSE
  control_freq: 20
  horizon: 200
  cameras:
  - robot0_eye_in_hand
  - agentview
  resolution: 256
model:
  checkpoint: lerobot/smolvla_base
  device: cuda
  instruction: lift the cube
  dataset_stats_key: so100
  autocast: none
  n_action_steps: 50
rollout:
  n_episodes: 5
  seed: 0
  action_space: degrees
  normalize_state: true
  save_frames_every: 0
